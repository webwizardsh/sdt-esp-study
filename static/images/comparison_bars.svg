<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" style="background:#0f172a; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
      <!-- Title -->
      <text x="270.0" y="24" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">Sensitivity Comparison Across Subjects (d' with 95% CI)</text>

      <!-- Reference Zero Line (Chance ESP) -->
      <line x1="60" y1="174.0" x2="500" y2="174.0" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4,4" />
      <text x="495" y="168.0" fill="#cbd5e1" font-size="10" text-anchor="end">H0: d'=0 (No ESP)</text>

      <!-- Bars and Error Bars -->
      
          <!-- Bar -->
          <rect x="145.0" y="165.7" width="50.0" height="8.3" fill="#38bdf8" rx="4" />
          
          <!-- 95% CI Error bar -->
          <line x1="170.0" y1="225.5" x2="170.0" y2="105.9" stroke="#f8fafc" stroke-width="2" />
          <line x1="164.0" y1="225.5" x2="176.0" y2="225.5" stroke="#f8fafc" stroke-width="2" />
          <line x1="164.0" y1="105.9" x2="176.0" y2="105.9" stroke="#f8fafc" stroke-width="2" />

          <!-- Value label -->
          <text x="170.0" y="97.9" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle">d'=0.10</text>

          <!-- X Label -->
          <text x="170.0" y="280.0" fill="#f1f5f9" font-size="11" font-weight="600" text-anchor="middle">Alice (Subject 1)</text>
          <text x="170.0" y="294.0" fill="#94a3b8" font-size="9" text-anchor="middle">Telepathy</text>
        
          <!-- Bar -->
          <rect x="365.0" y="167.0" width="50.0" height="7.0" fill="#38bdf8" rx="4" />
          
          <!-- 95% CI Error bar -->
          <line x1="390.0" y1="221.6" x2="390.0" y2="112.5" stroke="#f8fafc" stroke-width="2" />
          <line x1="384.0" y1="221.6" x2="396.0" y2="221.6" stroke="#f8fafc" stroke-width="2" />
          <line x1="384.0" y1="112.5" x2="396.0" y2="112.5" stroke="#f8fafc" stroke-width="2" />

          <!-- Value label -->
          <text x="390.0" y="104.5" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle">d'=0.08</text>

          <!-- X Label -->
          <text x="390.0" y="280.0" fill="#f1f5f9" font-size="11" font-weight="600" text-anchor="middle">Bob (Subject 2)</text>
          <text x="390.0" y="294.0" fill="#94a3b8" font-size="9" text-anchor="middle">Clairvoyance ROC</text>
        

      <!-- Y Axis -->
      <line x1="60" y1="45" x2="60" y2="260" stroke="#475569" stroke-width="1.5" />
      <text x="52" y="174.0" fill="#94a3b8" font-size="10" text-anchor="end">0.0</text>
      <text x="52" y="88.0" fill="#94a3b8" font-size="10" text-anchor="end">1.0</text>
      <text x="16" y="160.0" fill="#cbd5e1" font-size="11" text-anchor="middle" transform="rotate(-90 16 160.0)">Sensitivity (d')</text>
    </svg>